# Known vulnerabilities accepted temporarily. Every entry needs a reason and
# an expiry date: after `ignoreUntil` the scan fails again, forcing a decision.
# New vulnerabilities are never covered by this file.

# --- drizzle-kit (dev tooling only) -> @esbuild-kit -> esbuild 0.18.20.
# Affects esbuild's dev server, which this project never runs; not shipped.

[[IgnoredVulns]]
id = "GHSA-67mh-4wv8-2f99"
ignoreUntil = 2027-03-31
reason = "esbuild dev server via drizzle-kit; dev-only, not deployed"

# --- shadcn (CLI) -> fast-glob -> micromatch -> braces 3.0.3; no fixed version
# yet. Stack-overflow DoS needs an attacker-controlled glob pattern; the app
# only imports `shadcn/tailwind.css` at build time, never the CLI's globbing,
# and no user input becomes a glob. Short expiry to pick up the upstream fix.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-12-31
reason = "braces via the shadcn CLI's fast-glob; never called by the app, no user-supplied patterns; no fix released"

# --- workflow -> @workflow/nest (NestJS integration) -> @swc/cli -> binary
# downloader -> got -> cacheable-request -> http-cache-semantics 4.2.0; no
# fixed version yet. The flaw is in a shared HTTP cache serving one user's
# response to another; this chain only downloads SWC binaries for the NestJS
# CLI, which the app never loads: none of the 29 traced functions nor the
# server build include @workflow/nest, @swc/cli or http-cache-semantics
# (checked 2026-10-03, ADR-005). Short expiry to pick up the upstream fix.

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
ignoreUntil = 2026-12-31
reason = "http-cache-semantics via @workflow/nest's SWC CLI downloader; not in any deployed function; no fix released"

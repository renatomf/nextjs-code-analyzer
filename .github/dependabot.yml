version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Types must match the Node runtime actually used (24, in CI and on
      # Vercel); bump the major together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TD-39: TypeScript 7 and ESLint 10 failed the lint/typecheck check;
      # bump them when eslint-config-next and typescript-eslint support them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for all minor/patch bumps; majors come one by one.
      minor-and-patch:
        update-types: [minor, patch]

  # Also bumps the SHA-pinned actions (keeping the version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
